%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/sophgo,cv1800b-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sophgo CV1800B/SG2000 thermal sensor

maintainers:
  - Haylen Chu <heylenay@xxxxxxx>

description: |
  The Sophgo CV1800B and SG2000 SoCs integrate a temperature sensor with
  two measurement channels.  A channel reports a 13-bit raw value that is
  converted to milli-Celsius in software; high and low threshold
  violations can raise an interrupt.

  The SG2000 embeds the same sensor block, so it uses a SoC-specific
  compatible with "sophgo,cv1800b-thermal" as fallback.

$ref: thermal-sensor.yaml#

properties:
  compatible:
    oneOf:
      - const: sophgo,cv1800b-thermal
      - items:
          - const: sophgo,sg2000-thermal
          - const: sophgo,cv1800b-thermal

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - '#thermal-sensor-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    thermal-sensor@30e0000 {
        compatible = "sophgo,sg2000-thermal", "sophgo,cv1800b-thermal";
        reg = <0x30e0000 0x100>;
        clocks = <&clk CLK_TEMPSEN>;
        interrupts = <GIC_SPI 0 IRQ_TYPE_LEVEL_HIGH>;
        #thermal-sensor-cells = <0>;
    };
...
